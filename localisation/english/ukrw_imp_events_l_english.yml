l_english:

  # Events
  wtt_germany.1001.b: "I suppose we petition to join the British then."
  ukrework_improvements.1: "Victoria's Coronation"
  ukrework_improvements.1.t: "The Coronation of Kaiserin Victoria"
  ukrework_improvements.1.desc: "Today, after re-establishing all German Kingdoms, Empress Victoria was crowned Kaiserin von Großbritannien und Deutschland in Berlin, cementing her rule over Germany.\nThis ceremony only marks the first step towards a formal union of Great Britain and Germany, which will be discussed in the near future."
  ukrework_improvements.1.a: "Long live Kaiserin Victoria II!"
  ukrework_improvements.2: "Path of Democracy"
  ukrework_improvements.2.t: "The Future of the Anglo-German Democracy"
  ukrework_improvements.2.desc: "Along with the elections to parliament, marking the return of democracy to our nation, our people will decide about wether or not we shall keep our monarch as ceremonial head of state?"
  ukrework_improvements.2.a: "Yes, let's keep a royal representative."
	ukrework_improvements.2.a.tt: "Depending on our §Hcurrent monarch§!, we will gain a §Hminor boost§! to our nation."
  ukrework_improvements.2.b: "No, abolish the Monarchy all together!"
  ukrework_improvements.3: "Victoria's Return"
  ukrework_improvements.3.t: "Victoria Returns Home"
  ukrework_improvements.3.desc: "All over Germany, the people call for Victoria to recreate the German Empire, praising her achievements."
  ukrework_improvements.3.a: "That's very honoring, thank you."
  ukrework_improvements.4: "Selection of a Hohenzollern Monarch"
  ukrework_improvements.4.t: "Offer Wilhelm Prince of Prussia our throne?"
  ukrework_improvements.4.desc: "As the House of Hohenzollern is closely related to the Windsors, we seek to offer one of them our throne.\nOld Kaiser Wilhelm II refuses to work with us, should we try approaching his firstborn son?"
  ukrework_improvements.4.a: "Approach the firstborn, §HWilhelm Prince of Prussia§!."
  ukrework_improvements.4.a.tt: "This will offer the British throne to §HWilhelm Prince of Prussia§!, son of Kaiser §HWilhelm II§!.\nHowever, he will certainly be rather opposed to this offer, as he still hopes for a return to the German throne."
  ukrework_improvements.4.b: "Let's not bother him, keeping the British and German throne separate."
  ukrework_improvements.4.b.tt: "§RWe will hereby declare our intentions of returning to our beloved§! §HUnion Jack§! §Rand waive any claim to the German throne and lands.§!"
  ukrework_improvements.5: "Hohenzollern royal refuses"
  ukrework_improvements.5.t: "The royal rejects our throne!"
  ukrework_improvements.5.desc: "Just like the old Kaiser Wilhelm II, the Hohenzollern royal who we approached rejects our throne!\nBut, already suspecting them to do so, we were prepared and compiled a list with further suitable royals from the Hohenzollern family beforehand."
  ukrework_improvements.5.a: "Approach the Kaiser's secondborn, §HEitel Friedrich Prince of Prussia§!." 
  ukrework_improvements.5.b: "Approach the Wilhelm Prince of Prussia's firstborn, §HWilhelm Friedrich Prince of Prussia§!."
  ukrework_improvements.5.c: "Approach the Kaiser's youngest child, §HPrincess Victoria§!."
  ukrework_improvements.5.d: "Let's not bother them, instead keep the British and German throne separate."
  ukrework_improvements.6: "Further Negotiations"
  ukrework_improvements.6.t: "Offered Throne: Further Negotiations"
  ukrework_improvements.6.desc: "Princess Victoria has expressed her intention to accept our offer.\nHowever, her father, old Kaiser Wilhelm II, objects to this development unless our nation and our future Queen Victoria renounce all claims to the German throne and lands, including the Kingdom of Hanover, which belonged to her husband."
  ukrework_improvements.6.a: "Yes, we agree!"
  ukrework_improvements.6.b: "No, we will look for someone else instead."
  ukrework_improvements.7: "Germany wants to become our puppet"
  ukrework_improvements.7.t: "[From.GetName] wants to join us"
  ukrework_improvements.7.desc: "After the tragic loss of their monarch in the Hindenburg desaster, the provisional [From.GetAdjective] government seeks to unite our nations under our monarch [Eng.GetLeader] because they are the sole surviving member of the House of Hohenzollern, the [From.GetAdjective] royal house."
  ukrework_improvements.7.a: "What a splendid opportunity to unite our countries!"
  ukrework_improvements.7.b: "Their loss is not our problem!"
  ukrework_improvements.7.c: "We promised not to meddle in German affairs, so we don't!"
  ukrework_improvements.8: "England agrees"
  ukrework_improvements.8.t: "The [From.GetAdjective] Government Accepts our Petition!"
  ukrework_improvements.8.desc: "[From.GetLeader] decided in their eternal grace to grant us our petition, setting our two nations onto the path of full union."
  ukrework_improvements.8.a: "To a united future!"
  ukrework_improvements.9: "England refuses"
  ukrework_improvements.9.t: "The [From.GetAdjective] Government Refuses our Petition!"
  ukrework_improvements.9.desc: "[From.GetLeader] is not interested in a union of [From.GetName] and us.\nThey do, however, offer their condolences for our loss. Furthermore, they decided to guarantee our nation's independence, for that is the least they can do to assist us on our quest to find new leaders."
  ukrework_improvements.9.desc.2: "Just as [From.GetLeader] promised, they will not meddle in our nation's affairs.\nTherefore, they refused our petition and left us alone, searching for new leaders."
  ukrework_improvements.9.a: "We'll have to look for new leaders on our own then."
  EST_events.3: "Unification of the Nordics by Estonia"
